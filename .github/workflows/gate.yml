# The gate, run by someone other than the author.
#
# Local runs are the contract; this is the proof that the contract holds on a machine
# that has never seen this desk. Three jobs, because they fail for three different
# reasons and one red job should not hide the other two.
name: gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
      # The window tests build widgets without a desktop; without this Qt aborts the
      # process on a runner that has no display.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: pytest
        run: python -m pytest -q --no-header

      - name: ruff
        run: python -m ruff check .

      - name: compileall
        run: python -m compileall -q agent core app tests tools

      # A probe that stops parsing is invisible to ruff, which is excluded from
      # tools/probes on purpose. compileall is the only thing standing there.
      - name: manifest count
        run: |
          python -c "import pathlib,sys; n=len([l for l in pathlib.Path('MANIFEST.txt').read_text().splitlines() if l.strip() and not l.startswith('#')]); print('MANIFEST entries:', n); sys.exit(0 if n == 67 else 1)"

  rust:
    name: native/aes
    runs-on: windows-latest
    defaults:
      run:
        working-directory: native/aes
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/aes

      # --locked so a dependency that moved without a lockfile update fails here
      # rather than silently changing what the crate builds against.
      - name: cargo test
        run: cargo test --locked

      - name: cargo build
        run: cargo build --locked --release

  launcher:
    name: launcher freeze
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller

      # The artifact is not committed and must not be: this job is the only place a
      # launcher is ever built from a clean tree.
      - name: freeze
        run: python -m PyInstaller tools/sable-launcher.spec --distpath tools/dist --workpath tools/build --noconfirm

      - name: size
        shell: pwsh
        run: |
          $exe = Get-Item tools/dist/sable-launcher.exe
          Write-Host ("launcher: {0:N0} bytes" -f $exe.Length)
          if ($exe.Length -lt 5MB) { throw "launcher is suspiciously small: $($exe.Length) bytes" }

      # Boots three artifacts sealed with three different keys against the real frozen
      # image, with a payload whose import block is generated from agent/ rather than
      # typed. This is the only check that proves the bundle is complete at run time.
      - name: probe
        run: python tools/probes/sable_launcher.py tools/dist/sable-launcher.exe

      # The one-directory shape, proved the same way. Its exe cannot run without
      # _internal beside it, so the probe takes the tree and forges its artifacts in the
      # matching shape. A one-directory build that has never been booted is a guess.
      - name: freeze one-directory
        run: python -m PyInstaller tools/sable-launcher-onedir.spec --distpath tools/dist-onedir --workpath tools/build-onedir --noconfirm

      - name: probe one-directory
        run: python tools/probes/sable_launcher.py tools/dist-onedir/sable-launcher
